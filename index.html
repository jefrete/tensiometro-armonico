<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tensiómetro de Armonía</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--pk:#ff2bd1;--pk2:#ff8ae8;--k:#050507;--w:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--k);font-family:"Space Grotesk",system-ui,sans-serif}
h1,.big,.chord{font-family:Unbounded,"Arial Black",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px}
h1{margin:0;font-size:clamp(16px,2.6vw,24px);font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--pk),#7a00ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 13px "Space Grotesk",sans-serif;border:3px solid var(--k);background:#fff;color:var(--k);border-radius:999px;padding:10px 18px;cursor:pointer;transition:.15s}
.btn:hover{background:linear-gradient(90deg,var(--pk2),var(--pk));transform:translateY(-2px)}
.btn.on{background:var(--k);color:#fff}
.btn:focus-visible,.key:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:0 18px 30px}
.stage{position:relative;height:min(68vh,640px);min-height:420px;border:4px solid var(--k);border-radius:36px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#fff 30%,#ffd9f6 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:22px;bottom:20px;right:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;pointer-events:none}
.big{font-size:clamp(54px,11vw,120px);font-weight:800;line-height:.9;letter-spacing:-.05em;-webkit-text-stroke:3px var(--k);color:#fff;text-shadow:5px 5px 0 var(--pk)}
.chord{font-size:clamp(16px,2.4vw,26px);font-weight:800;margin-top:10px}
.fn{font-size:13px;letter-spacing:.1em;margin-top:4px}
.tn{min-width:min(280px,100%);text-align:right}
.tn b{font:800 clamp(32px,5vw,52px) Unbounded,sans-serif}
.track{height:20px;border:3px solid var(--k);border-radius:999px;background:#fff;overflow:hidden;margin-top:8px}
#meter{height:100%;width:0;background:linear-gradient(90deg,#fff,var(--pk) 55%,var(--k));transition:width .25s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{border:3px solid var(--k);border-radius:28px;padding:18px;background:#fff}
.card h2{margin:0 0 12px;font:800 13px Unbounded,sans-serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{border:3px solid var(--k);border-radius:20px;padding:8px 12px;min-width:0}
.stat small{display:block;font-size:11px;color:#555}
.stat strong{font:800 15px Unbounded,sans-serif;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid var(--k);border-radius:999px;padding:6px 14px;font-size:13px;background:linear-gradient(90deg,#fff,#ffe3f8)}
.piano{overflow-x:auto;padding-bottom:6px}
.keys{position:relative;height:170px;width:max-content;min-width:100%}
.key{position:absolute;top:0;border:3px solid var(--k);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:11px;background:#fff;padding-inline:0}
.key.w{width:42px;height:170px;border-radius:0 0 14px 14px;background:linear-gradient(#fff,#f3f3f3)}
.key.b{width:28px;height:104px;z-index:2;border-radius:0 0 10px 10px;background:linear-gradient(#222,var(--k));color:#fff}
.key.on{background:linear-gradient(var(--pk2),var(--pk));color:#000}
.hist{display:flex;align-items:center;gap:6px;height:80px;overflow-x:auto}
.dot{flex:none;border:3px solid var(--k);border-radius:50%;background:linear-gradient(135deg,#fff,var(--pk))}
.log{font-size:12px;color:#444;margin:10px 4px 0;min-height:18px}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<header>
  <h1>TENSIÓMETRO <span>DE ARMONÍA</span></h1>
  <div class="btns">
    <button class="btn" id="tab">Audio de pestaña</button>
    <button class="btn" id="mic">Micrófono</button>
    <button class="btn" id="clear">Limpiar</button>
  </div>
</header>
<main>
  <section class="stage">
    <canvas id="gl"></canvas>
    <div class="hud">
      <div>
        <div class="big" id="note">—</div>
        <div class="chord" id="chord">SIN SEÑAL</div>
        <div class="fn" id="fn">Tocá notas o activá el audio</div>
      </div>
      <div class="tn">tensión <b id="tv">0%</b><div class="track"><div id="meter"></div></div></div>
    </div>
  </section>
  <div class="grid">
    <section class="card">
      <h2>Análisis</h2>
      <div class="stats">
        <div class="stat"><small>grado</small><strong id="deg">—</strong></div>
        <div class="stat"><small>tonalidad</small><strong id="key">A menor</strong></div>
        <div class="stat"><small>notas</small><strong id="nts">—</strong></div>
      </div>
      <div class="chips" id="ivs"><span class="chip">Esperando notas…</span></div>
    </section>
    <section class="card">
      <h2>Historial de tensión</h2>
      <div class="hist" id="hist"></div>
      <div class="log" id="log"></div>
    </section>
  </div>
  <section class="card" style="margin-top:18px">
    <h2>Piano · teclado A S D F G H J K · W E T Y U</h2>
    <div class="piano"><div class="keys" id="keys"></div></div>
  </section>
</main>

<script>
const $=i=>document.getElementById(i);
const N=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const IV=["Unísono","2ª menor","2ª mayor","3ª menor","3ª mayor","4ª justa","Tritono","5ª justa","6ª menor","6ª mayor","7ª menor","7ª mayor"];
const MAJ=[0,2,4,5,7,9,11],MIN=[0,3-1,3,5,7,8,10].map((v,i)=>i==1?2:v);
const CH=[["",[0,4,7]],["m",[0,3,7]],["7",[0,4,7,10]],["m7",[0,3,7,10]],["maj7",[0,4,7,11]],["dim",[0,3,6]],["°7",[0,3,6,9]],["m7♭5",[0,3,6,10]],["aug",[0,4,8]],["sus4",[0,5,7]],["sus2",[0,2,7]],["5",[0,7]]];
const MINQ=["m","m7","dim","°7","m7♭5"];
const FUNC=["TÓNICA","SUBDOMINANTE","TÓNICA","SUBDOMINANTE","DOMINANTE","TÓNICA","DOMINANTE"];
const BASE={"TÓNICA":5,"SUBDOMINANTE":35,"DOMINANTE":65};
const ROMAN=["I","II","III","IV","V","VI","VII"];
let root=9,mode="minor",ac=null,cap=null;
const active=new Set();
const log=t=>{$("log").textContent=t};

/* ---------- análisis armónico ---------- */
function detect(notes){
  const bass=notes[0]%12,pcs=[...new Set(notes.map(n=>n%12))];
  if(pcs.length===1)return{root:bass,q:"",name:N[bass]};
  for(const r of [bass,...pcs.filter(p=>p!==bass)]){
    const rel=pcs.map(p=>(p-r+12)%12).sort((a,b)=>a-b);
    const t=CH.find(c=>c[1].length===rel.length&&c[1].every((v,i)=>v===rel[i]));
    if(t)return{root:r,q:t[0],name:N[r]+t[0]+(r!==bass?"/"+N[bass]:"")};
  }
  return{root:bass,q:null,name:"CONJUNTO"};
}
function analyze(){
  const notes=[...active].sort((a,b)=>a-b);
  if(!notes.length)return reset();
  const c=detect(notes),minor=mode==="minor",sc=minor?MIN:MAJOR_();
  const iv=(c.root-root+12)%12;
  let idx=sc.indexOf(iv);if(idx<0&&minor&&iv===11)idx=6;
  const pcs=[...new Set(notes.map(n=>n%12))];
  const inS=p=>{const d=(p-root+12)%12;return sc.includes(d)||(minor&&d===11)};
  let fn=idx<0?"CROMÁTICO":FUNC[idx];
  if(c.q==="7"&&idx!==4)fn="DOMINANTE SECUNDARIA";
  let deg="—";
  if(idx>=0){deg=ROMAN[idx];if(MINQ.includes(c.q))deg=deg.toLowerCase();if(c.q==="dim"||c.q==="°7")deg+="°";if(c.q==="m7♭5")deg+="ø"}
  let t=BASE[fn]!==undefined?BASE[fn]:55;
  if(c.q==="7")t+=15;
  if(["dim","°7","m7♭5"].includes(c.q))t+=15;
  if(c.q==="aug")t+=10;
  pcs.forEach(p=>{if(!inS(p))t+=12});
  for(let i=0;i<pcs.length;i++)for(let j=i+1;j<pcs.length;j++){
    const d=Math.abs(pcs[i]-pcs[j]),ic=Math.min(d,12-d);
    if(ic===1)t+=8;if(ic===6)t+=10;
  }
  t=Math.min(100,Math.round(t));
  $("note").textContent=N[c.root];$("chord").textContent=c.name;$("fn").textContent=fn;
  $("deg").textContent=deg;$("nts").textContent=pcs.map(p=>N[p]).join(" ");
  $("tv").textContent=t+"%";$("meter").style.width=t+"%";
  const bass=notes[0];
  $("ivs").innerHTML=notes.length<2?'<span class="chip">Tocá más de una nota</span>':
    notes.map(n=>{const d=n-bass;return '<span class="chip"><b>'+N[n%12]+'</b> '+(d===0?"Fundamental":d===12?"Octava":IV[d%12]+(d>12?" (+8ª)":""))+'</span>'}).join("");
  const h=$("hist"),dot=document.createElement("div");
  dot.className="dot";const s=14+t*.5;dot.style.width=dot.style.height=s+"px";
  dot.style.background="linear-gradient(135deg,#fff,var(--pk) "+(40+t/2)+"%,"+(t>70?"#050507":"var(--pk)")+")";
  h.appendChild(dot);if(h.children.length>60)h.firstChild.remove();h.scrollLeft=h.scrollWidth;
  viz.set(t/100,pcs,c.root);
}
function MAJOR_(){return MAJ}
function reset(){
  $("note").textContent="—";$("chord").textContent="SIN SEÑAL";$("fn").textContent="Tocá notas o activá el audio";
  $("deg").textContent="—";$("nts").textContent="—";$("tv").textContent="0%";$("meter").style.width="0%";
  $("ivs").innerHTML='<span class="chip">Esperando notas…</span>';viz.set(0,[],-1);
}

/* ---------- notas, piano, sonido ---------- */
function tone(m){
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.value=440*2**((m-69)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+1);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.05);
}
function refresh(){
  document.querySelectorAll(".key").forEach(k=>k.classList.toggle("on",active.has(+k.dataset.m)));
  analyze();
}
const on=(m,s)=>{if(active.has(m))return;active.add(m);if(s)tone(m);refresh()};
const off=m=>{if(active.delete(m))refresh()};
const toggle=m=>active.has(m)?off(m):on(m,true);
$("clear").onclick=()=>{active.clear();refresh()};
(function(){
  const p=$("keys");let w=0;
  for(let m=48;m<=72;m++){
    if([1,3,6,8,10].includes(m%12))continue;
    const k=document.createElement("button");k.className="key w";k.dataset.m=m;k.style.left=w*42+"px";
    k.textContent=N[m%12]+(m%12===0?(m/12-1):"");k.onclick=()=>toggle(m);p.appendChild(k);
    if([0,2,5,7,9].includes(m%12)&&m<72){
      const b=document.createElement("button");b.className="key b";b.dataset.m=m+1;b.style.left=w*42+28+"px";
      b.onclick=()=>toggle(m+1);b.setAttribute("aria-label",N[(m+1)%12]);p.appendChild(b);
    }
    w++;
  }
  p.style.width=w*42+"px";
})();
const PC={a:60,w:61,s:62,e:63,d:64,f:65,t:66,g:67,y:68,h:69,u:70,j:71,k:72};
const skip=e=>e.ctrlKey||e.metaKey||e.altKey;
document.addEventListener("keydown",e=>{if(e.repeat||skip(e))return;const m=PC[e.key.toLowerCase()];if(m!==undefined)on(m,true)});
document.addEventListener("keyup",e=>{if(skip(e))return;const m=PC[e.key.toLowerCase()];if(m!==undefined)off(m)});
(async()=>{
  if(!navigator.requestMIDIAccess)return;
  try{
    const a=await navigator.requestMIDIAccess();
    const at=()=>a.inputs.forEach(i=>i.onmidimessage=e=>{
      const[s,n,v]=e.data,c=s&0xf0;
      if(c===0x90&&v>0)on(n,false);else if(c===0x80||c===0x90)off(n);
    });
    at();a.onstatechange=at;
  }catch(_){}
})();

/* ---------- audio en vivo + tonalidad ---------- */
const KMAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const KMIN=[6.33,2.68,3.52,5.38,2.6,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
const kc=new Array(12).fill(0);
function corr(a,b){
  const ma=a.reduce((x,y)=>x+y)/12,mb=b.reduce((x,y)=>x+y)/12;let s=0,da=0,db=0;
  for(let i=0;i<12;i++){s+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}
  return s/Math.sqrt(da*db||1);
}
function bestKey(){
  if(kc.reduce((a,b)=>a+b,0)<15)return null;
  let best=null;
  for(let r=0;r<12;r++)for(const m of["major","minor"]){
    const c=corr(kc.map((_,i)=>kc[(i+r)%12]),m==="minor"?KMIN:KMAJ);
    if(!best||c>best.c)best={r,m,c};
  }
  return best;
}
function stopAudio(){
  if(cap){clearInterval(cap.timer);cap.stream.getTracks().forEach(t=>t.stop());cap=null}
  $("tab").classList.remove("on");$("mic").classList.remove("on");
  kc.fill(0);active.clear();refresh();
}
async function listen(kind){
  if(cap){stopAudio();return}
  try{
    const md=navigator.mediaDevices;
    const stream=kind==="mic"?await md.getUserMedia({audio:true}):await md.getDisplayMedia({video:true,audio:true});
    if(!stream.getAudioTracks().length){stream.getTracks().forEach(t=>t.stop());log("No se compartió audio. Elegí una pestaña y activá «compartir audio».");return}
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
    const an=ac.createAnalyser();an.fftSize=16384;an.smoothingTimeConstant=.6;
    ac.createMediaStreamSource(stream).connect(an);
    const data=new Float32Array(an.frequencyBinCount),hz=ac.sampleRate/an.fftSize,ch=new Array(12).fill(0);
    let last="",pend="",kn=0,kp="";
    const timer=setInterval(()=>{
      an.getFloatFrequencyData(data);
      const c=new Array(12).fill(0);let max=-Infinity;
      for(let i=Math.ceil(80/hz);i<1500/hz;i++){
        const v=data[i];if(v>max)max=v;
        if(v>-75&&v>data[i-1]&&v>=data[i+1]){
          const a=data[i-1],den=a-2*v+data[i+1],f=(i+(den?.5*(a-data[i+1])/den:0))*hz;
          const m=Math.round(69+12*Math.log2(f/440));
          c[(m%12+12)%12]+=Math.sqrt(10**(v/20))*(f<300?2:1);
        }
      }
      for(let p=0;p<12;p++)ch[p]=ch[p]*.6+c[p]*.4;
      const s=c.reduce((a,b)=>a+b,0);
      if(s>0&&max>-60){
        for(let p=0;p<12;p++)kc[p]=kc[p]*.997+c[p]/s;
        const k=bestKey();
        if(k){
          const id=k.r+k.m;kn=id===kp?kn+1:1;kp=id;
          if(kn>=12&&(k.r!==root||k.m!==mode)){root=k.r;mode=k.m;$("key").textContent=N[root]+(mode==="minor"?" menor":" mayor");analyze()}
        }
      }
      const top=Math.max(...ch);let sel=[];
      if(max>-60&&top>0)sel=ch.map((v,p)=>[v,p]).filter(x=>x[0]>=top*.6).sort((a,b)=>b[0]-a[0]).slice(0,4);
      const sig=sel.map(x=>x[1]).join(",");
      if(sig!==pend){pend=sig;return}
      if(sig===last)return;
      last=sig;active.clear();
      sel.forEach((x,i)=>active.add((i===0?48:60)+x[1]));
      refresh();
    },150);
    cap={stream,timer};
    stream.getAudioTracks()[0].onended=stopAudio;
    $(kind==="mic"?"mic":"tab").classList.add("on");log("Escuchando… la tonalidad se detecta sola.");
  }catch(err){log("No se pudo capturar el audio: "+err.message)}
}
$("tab").onclick=()=>listen("tab");
$("mic").onclick=()=>listen("mic");

/* ---------- Three.js ---------- */
const viz=(()=>{
  const cv=$("gl"),st=document.querySelector(".stage");
  const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));
  const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.set(0,0,11);
  const G=new THREE.Group();S.add(G);
  const BK=new THREE.MeshBasicMaterial({color:0x050507}),
        BKB=new THREE.MeshBasicMaterial({color:0x050507,side:THREE.BackSide});
  const orb=new THREE.Mesh(new THREE.SphereGeometry(1.25,64,64),new THREE.ShaderMaterial({
    uniforms:{uT:{value:0},uTime:{value:0}},
    vertexShader:"varying vec3 vP;uniform float uT,uTime;void main(){vec3 p=position;p+=normal*sin(p.x*3.+uTime*2.)*sin(p.y*3.-uTime*1.5)*sin(p.z*3.+uTime)*.1*uT;vP=p;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}",
    fragmentShader:"varying vec3 vP;uniform float uT;void main(){float g=vP.y*.4+.5;vec3 c=mix(vec3(1.),vec3(1.,.17,.82),smoothstep(0.,1.,g*-1.+.9+uT*.9-.3));c=mix(c,vec3(.03,0.,.08),smoothstep(.65,1.,uT)*(1.-g));gl_FragColor=vec4(c,1.);}"
  }));
  const ol=new THREE.Mesh(new THREE.SphereGeometry(1.25,48,48),BKB);ol.scale.setScalar(1.08);
  G.add(orb,ol);
  const RR=3.1,rings=[];
  [[RR,.07],[RR*1.32,.03],[RR*.62,.04]].forEach(([r,t],i)=>{
    const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,16,128),i===2?new THREE.MeshBasicMaterial({color:0xff2bd1}):BK);G.add(m);rings.push(m);
  });
  const nodes=[];
  const label=txt=>{
    const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");
    x.font="800 64px Unbounded,Arial Black,sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillStyle="#050507";x.fillText(txt,64,68);
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(.8,.8,1);return s;
  };
  for(let p=0;p<12;p++){
    const a=p/12*Math.PI*2-Math.PI/2,x=Math.cos(a)*RR,y=-Math.sin(a)*RR*-1;
    const fill=new THREE.Mesh(new THREE.SphereGeometry(.3,32,32),new THREE.MeshBasicMaterial({color:0xffffff}));
    const out=new THREE.Mesh(new THREE.SphereGeometry(.3,32,32),BKB);out.scale.setScalar(1.28);
    const n=new THREE.Group();n.add(fill,out);n.position.set(x,-y*-1*-1,0);n.position.y=Math.sin(Math.PI/2-p/12*Math.PI*2)*RR;n.position.x=Math.cos(Math.PI/2-p/12*Math.PI*2)*RR;
    const l=label(N[p]);l.position.set(n.position.x*1.2,n.position.y*1.2,0);
    G.add(n,l);nodes.push({n,fill,s:1,a:0});
  }
  const tonic=new THREE.Mesh(new THREE.TorusGeometry(.55,.06,12,48),new THREE.MeshBasicMaterial({color:0xff2bd1}));tonic.visible=false;G.add(tonic);
  let web=new THREE.Group();G.add(web);
  const ripples=[];
  let tT=0,tC=0,pcsA=[],mx=0,my=0;
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  function size(){const w=st.clientWidth,h=st.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.position.z=w/h<1?17:11;cam.updateProjectionMatrix()}
  addEventListener("resize",size);size();
  const pos=p=>nodes[p].n.position;
  function set(t,pcs,r){
    tT=t;pcsA=pcs;
    web.children.forEach(c=>{c.geometry.dispose();web.remove(c)});
    nodes.forEach((o,p)=>{o.a=pcs.includes(p)?1:0});
    tonic.visible=r>=0;if(r>=0)tonic.position.copy(pos(r));
    if(pcs.length>1){
      const pts=[...pcs].sort((a,b)=>a-b).map(p=>pos(p));
      if(pts.length>2){
        const sh=new THREE.Shape(pts.map(v=>new THREE.Vector2(v.x,v.y)));
        web.add(new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:0xff2bd1,transparent:true,opacity:.22,side:THREE.DoubleSide})));
      }
      const L=pts.length===2?1:pts.length;
      for(let i=0;i<L;i++)web.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(pts[i],pts[(i+1)%pts.length]),1,.045,8),BK));
    }
    if(pcs.length){
      const m=new THREE.Mesh(new THREE.TorusGeometry(1.3,.05,12,96),new THREE.MeshBasicMaterial({color:0xff2bd1,transparent:true}));
      G.add(m);ripples.push({m,t:0});
    }
  }
  const clock=new THREE.Clock(),pk=new THREE.Color(0xff2bd1),wh=new THREE.Color(0xffffff);
  (function loop(){
    const dt=clock.getDelta(),T=clock.elapsedTime;
    tC+=(tT-tC)*.06;
    const beat=1+Math.sin(T*(2+tC*7))*.04*(.4+tC);
    orb.scale.setScalar((1+tC*.25)*beat);
    orb.material.uniforms.uT.value=tC;orb.material.uniforms.uTime.value=T;
    orb.rotation.y=T*.3;
    rings[0].rotation.z=T*.15*(1+tC*3);rings[1].rotation.z=-T*.1*(1+tC*2);rings[1].rotation.x=Math.sin(T*.4)*.5;
    rings[2].scale.setScalar(.85+tC*.5+Math.sin(T*3)*.02);
    nodes.forEach(o=>{
      o.s+=(1+o.a*.55-o.s)*.15;o.n.scale.setScalar(o.s);
      o.fill.material.color.lerp(o.a?pk:wh,.2);
    });
    tonic.rotation.z=T;
    for(let i=ripples.length-1;i>=0;i--){
      const r=ripples[i];r.t+=dt*.9;r.m.scale.setScalar(1+r.t*3.2);r.m.material.opacity=Math.max(0,1-r.t);
      if(r.t>=1){G.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();ripples.splice(i,1)}
    }
    G.rotation.y+=((mx*.7)-G.rotation.y)*.05;G.rotation.x+=((my*.5)-G.rotation.x)*.05;
    R.render(S,cam);requestAnimationFrame(loop);
  })();
  return{set};
})();
log("Listo. Tocá el piano, conectá un MIDI o escuchá audio.");
